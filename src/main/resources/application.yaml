spring:
  application:
    name: notify
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: ${PORT:8080}
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
  max-http-request-header-size: 8KB

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

notify:
  security:
    allowed-origins: ${NOTIFY_ALLOWED_ORIGINS:}
    max-event-body-bytes: ${NOTIFY_MAX_EVENT_BODY_BYTES:65536}
  delivery:
    enabled: ${NOTIFY_DELIVERY_ENABLED:true}
    fixed-delay-ms: ${NOTIFY_DELIVERY_FIXED_DELAY_MS:5000}
    batch-size: ${NOTIFY_DELIVERY_BATCH_SIZE:50}
    max-attempts: ${NOTIFY_DELIVERY_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${NOTIFY_DELIVERY_RETRY_BACKOFF_SECONDS:60}
  events:
    recovery:
      enabled: ${NOTIFY_EVENT_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${NOTIFY_EVENT_RECOVERY_FIXED_DELAY_MS:60000}
      stale-after-seconds: ${NOTIFY_EVENT_RECOVERY_STALE_AFTER_SECONDS:120}
      batch-size: ${NOTIFY_EVENT_RECOVERY_BATCH_SIZE:50}
  email:
    enabled: ${NOTIFY_EMAIL_ENABLED:false}
    from: ${NOTIFY_EMAIL_FROM:connect@campuscritique.in}
    from-name: ${NOTIFY_EMAIL_FROM_NAME:CampusCritique}
    reply-to: ${NOTIFY_EMAIL_REPLY_TO:connect@campuscritique.in}
    resend:
      api-key: ${NOTIFY_EMAIL_RESEND_API_KEY:${RESEND_API_KEY:${SPRING_MAIL_PASSWORD:}}}
      base-url: ${NOTIFY_EMAIL_RESEND_BASE_URL:https://api.resend.com}
  rabbitmq:
    events:
      exchange: notify.events
      queue: notify.events.queue
      routing-key: notification.event.received
