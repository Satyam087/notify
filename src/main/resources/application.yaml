spring:
  application:
    name: notify
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

notify:
  rabbitmq:
    events:
      exchange: notify.events
      queue: notify.events.queue
      routing-key: notification.event.received
