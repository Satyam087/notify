spring:
  application:
    name: notify
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
  max-http-request-header-size: 8KB

management:
  endpoints:
    web:
      exposure:
        include: health,info

notify:
  security:
    allowed-origins: ${NOTIFY_ALLOWED_ORIGINS:}
    max-event-body-bytes: ${NOTIFY_MAX_EVENT_BODY_BYTES:65536}
  rabbitmq:
    events:
      exchange: notify.events
      queue: notify.events.queue
      routing-key: notification.event.received
